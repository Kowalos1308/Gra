<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabela zamówień vape</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container admin-container">
    <header class="hero">
      <p class="kicker">Panel podsumowania</p>
      <h1>Tabela zamówień</h1>
    </header>

    <div class="admin-actions">
      <button id="resetOrdersBtn" class="danger-btn">Zresetuj zamówienie</button>
      <a href="index.html" class="admin-link">← Powrót do wyboru</a>
    </div>

    <div class="table-wrap">
      <table id="ordersTable"></table>
    </div>

    <section class="panel bulk-panel">
      <h2>Zamówienie zbiorcze</h2>
      <textarea id="bulkOrderText" class="bulk-output" readonly></textarea>
    </section>

    <section class="panel">
      <h2>Dodaj użytkownika</h2>
      <form id="addUserForm" class="admin-access-form">
        <input id="newUserName" type="text" placeholder="Nazwa użytkownika" required />
        <input id="newUserPassword" type="text" placeholder="Hasło użytkownika" required />
        <button type="submit" class="user-btn">Dodaj</button>
      </form>
      <p id="addUserMessage" class="access-message" aria-live="polite"></p>
    </section>


    <section class="panel">
      <h2>Kalkulacja</h2>
      <div class="calc-controls">
        <label for="purchasePriceInput">Wprowadź cenę zakupu:</label>
        <input id="purchasePriceInput" type="number" step="0.01" min="0" placeholder="np. 35" />
        <button id="recalculateBtn" type="button" class="user-btn">Przelicz</button>
      </div>

      <div class="table-wrap calc-table-wrap">
        <table class="calc-table">
          <thead>
            <tr>
              <th>Użytkownik</th>
              <th>Ilość sztuk</th>
              <th>Cena</th>
              <th>Suma</th>
            </tr>
          </thead>
          <tbody id="calcTableBody"></tbody>
        </table>
      </div>

      <div class="calc-summary">
        <p id="summaryPaid">Ja zapłacę za vape: 0.00 zł</p>
        <p id="summaryReceived">Oni zapłacą mi: 0.00 zł</p>
      </div>
    </section>

    <section class="panel">
      <h2>Lista użytkowników i haseł</h2>
      <ul id="usersList" class="users-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
