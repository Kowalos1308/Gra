<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabela zamówień vape</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container admin-container">
    <header class="hero">
      <p class="kicker">Panel podsumowania</p>
      <h1>Tabela zamówień</h1>
    </header>

    <div class="admin-actions">
      <button id="resetOrdersBtn" class="danger-btn">Zresetuj zamówienie</button>
      <a href="index.html" class="admin-link">← Powrót do wyboru</a>
    </div>

    <div class="table-wrap">
      <table id="ordersTable"></table>
    </div>

    <section class="panel bulk-panel">
      <h2>Zamówienie zbiorcze</h2>
      <textarea id="bulkOrderText" class="bulk-output" readonly></textarea>
    </section>

    <section class="panel calc-panel">
      <h2>Kalkulacja</h2>
      <label class="calc-label" for="purchasePriceInput">Wprowadź cenę zakupu (za sztukę)</label>
      <div class="calc-controls">
        <input id="purchasePriceInput" class="calc-input" type="number" min="0" step="0.01" placeholder="np. 24.50" />
        <button id="recalculateBtn" class="user-btn" type="button">Przelicz</button>
      </div>

      <div class="table-wrap calc-table-wrap">
        <table id="calculationTable" class="calculation-table"></table>
      </div>

      <div id="calcSummary" class="calc-summary"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
