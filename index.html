<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zamówienia Vape</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <p class="kicker">Szybkie zamówienia</p>
      <h1>Wybierz użytkownika i naklikaj vape</h1>
      <p class="subtitle">Każdy kafelek to 1 urządzenie (3 smaki). Dotknij kafelka, aby zwiększyć ilość.</p>
      <p class="hint">Dodaj własne zdjęcia do folderu <code>images/</code> jako pliki <code>1.jpg</code> … <code>10.jpg</code>.</p>
    </header>

    <section class="panel">
      <h2>1) Wybierz użytkownika</h2>
      <div id="userPicker" class="user-picker" aria-label="Wybór użytkownika"></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>2) Wybierz vape</h2>
        <span id="activeUserLabel" class="active-user">Brak wybranego użytkownika</span>
      </div>
      <div id="flavorGrid" class="flavor-grid"></div>
    </section>

    <a href="admin.html" class="admin-link">Podgląd tabeli zamówień →</a>
  </main>

  <script src="app.js"></script>
</body>
</html>
